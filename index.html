<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="version" content="1.11">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dPaul Music">
<meta name="application-name" content="dPaul Music">
<meta name="theme-color" content="#111111">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>dPaul Music</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #111; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: #111;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    /* Fill the whole screen, keeping clear of the notch and home bar */
    padding: calc(36px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             24px calc(16px + env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { width: 100%; max-width: 820px; margin: 0 auto; }

  h1 { font-size: clamp(30px, 8vw, 44px); text-align: center; margin: 8px 0 20px; }

  button {
    font-family: inherit;
    font-weight: bold;
    font-size: clamp(24px, 6.5vw, 36px);
    color: #111;
    background: #b0b0b0;
    border: 3px solid #8c8c8c;
    border-radius: 18px;
    padding: 20px 12px;
    width: 100%;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button:active { filter: brightness(0.8); }
  button:focus-visible { outline: 6px solid #fff; outline-offset: 4px; }

  /* ── Genre buttons ── */
  .genres { display: grid; grid-template-columns: 1fr 1fr 2.6fr; gap: 8px; margin-bottom: 12px; }
  .genres button {
    background: #000; color: #ff8c00; border-color: #ff8c00; min-width: 0; padding: 7px 2px;
    font-size: clamp(17px, 4.6vw, 28px); font-weight: 900; border-radius: 14px;
  }
  .genres button[aria-pressed="true"] { background: #ff8c00; color: #111; }


  /* ── Player ── */
  /* Cover on the left, song details beside it on the right. Sized by
     screen height too, so the buttons still fit without scrolling. */
  .now { display: flex; flex-direction: row; align-items: center; gap: 16px; margin-bottom: 14px; }
  /* Fixed-size box: its space is kept even while the picture loads
     or when a song has none, so the buttons never jump. */
  .now .art { width: min(46vw, 29vh, 340px); height: min(46vw, 29vh, 340px); border-radius: 14px; background: #222; overflow: hidden; flex-shrink: 0; }
  .now .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .now .art img[hidden] { display: none; }
  .now .art { position: relative; }
  .now .art-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 10px; text-align: center; color: #aaa; line-height: 1.2;
    font-size: clamp(14px, 3.6vw, 20px);
  }
  .now .art-msg[hidden] { display: none; }
  .now .art-msg.flash {
    color: #fff; font-weight: 900; font-size: clamp(16px, 4.2vw, 24px);
    animation: art-flash 1s ease-in-out infinite;
  }
  /* No artwork: a plain "white label" record fills the box */
  .now .art-msg.white-label {
    padding: 0; font-size: 0;
    background:
      radial-gradient(circle, #111 0 3%, #fff 3.5% 22%, #111 22.5% 23.5%,
        transparent 24%),
      repeating-radial-gradient(circle, #0b0b0b 0 1.5px, #1c1c1c 1.5px 3px);
    border-radius: 50%;
  }
  @keyframes art-flash {
    0%, 100% { opacity: 1; background: #1565c0; }
    50%      { opacity: 0.35; background: #222; }
  }
  .now-text { text-align: left; min-width: 0; flex: 1 1 0; }
  /* Always two lines tall, whether the name is short or long */
  .now .track {
    font-size: clamp(22px, 6vw, 38px); font-weight: bold; line-height: 1.2; max-height: 2.4em;
    word-break: break-word; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .now .track .year { color: #ffd400; white-space: nowrap; }
  .now .artist { font-size: clamp(18px, 4.6vw, 28px); font-weight: bold; color: #4fc3ff; margin-top: 6px; line-height: 1.2; }
  .now .from { font-size: clamp(15px, 3.8vw, 22px); color: #ddd; margin-top: 4px; line-height: 1.25; }
  .now .from:empty, .now .artist:empty { display: none; }
  .now .count { font-size: clamp(15px, 3.8vw, 22px); color: #aaa; margin-top: 6px; }

  /* Previous / Play / Next stay in one row, even on a phone */
  /* Icon buttons: plain drawn shapes, no text */
  .icon-btn { display: flex; align-items: center; justify-content: center; padding: 0; color: #111; }
  .icon-btn svg { fill: currentColor; display: block; }

  .controls { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 8px; margin-bottom: 10px; }
  .controls button { height: min(clamp(150px, 37vw, 200px), 16vh); }
  /* Graphic EQ bars */
  /* The page fills the screen, and the EQ takes all the spare height */
  body { display: flex; flex-direction: column; }
  .wrap { flex: 1 0 auto; display: flex; flex-direction: column; }
  #player { flex: 1 0 auto; display: flex; flex-direction: column; }
  #player[hidden] { display: none; }
  #eq { display: block; width: 100%; height: 0; flex: 1 0 0px; min-height: min(clamp(48px, 14vw, 72px), 8vh); margin-bottom: 10px; }
  /* Radio playing: no play / skip / thumbs, so the EQ gets their space.
     They come back if the radio is paused (a call, or the lock screen). */
  #player.radio-on .controls, #player.radio-on .rate { display: none; }
  .controls svg { width: 58%; max-width: 90px; height: auto; }
  #btn-prev, #btn-next { background: #000; color: #ff8c00; border-color: #ff8c00; }
  #btn-play { background: #1e88e5; color: #fff; border-color: #64b5f6; }
  #btn-play svg { width: 46%; max-width: 80px; }
  #btn-play.playing { background: #1565c0; border-color: #90caf9; animation: play-flash 1.2s ease-in-out infinite; }
  /* Playing: the button gently flashes */
  @keyframes play-flash {
    0%, 100% { background: #1565c0; box-shadow: 0 0 0 0 rgba(100, 181, 246, 0); }
    50%      { background: #42a5f5; box-shadow: 0 0 22px 6px rgba(100, 181, 246, 0.75); }
  }
  @media (prefers-reduced-motion: reduce) { #btn-play.playing { animation-duration: 2.4s; } }

  /* Thumbs down / thumbs up */
  .rate { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rate button { background: #3a3a3a; color: #cfcfcf; border-color: #555; height: min(clamp(50px, 12vw, 66px), 7.5vh); }
  .rate svg { width: clamp(32px, 8.5vw, 46px); height: auto; }
  /* Grey until pressed; pressing one hides the other until the next song */
  #btn-like    { background: #2e7d32; color: #fff; border-color: #66bb6a; }
  #btn-dislike { background: #c62828; color: #fff; border-color: #ef5350; }
  /* Pressed: brighter, with a white edge */
  #btn-like.on    { background: #43c84a; color: #fff; border-color: #fff; }
  #btn-dislike.on { background: #ff3b30; color: #fff; border-color: #fff; }
  .rate button.gone { visibility: hidden; }


  .msg { text-align: center; font-size: clamp(20px, 5vw, 28px); margin-top: 16px; color: #ff6b6b; }
  .msg:empty { display: none; }

  /* Big Back button, pinned to the bottom of the screen */
  .back-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(8px + env(safe-area-inset-bottom));
    background: #111;
    border-top: 3px solid #333;
    z-index: 10;
  }
  .back-bar button, .back-bar a {
    max-width: 820px; margin: 0 auto; display: block;
    text-align: center; text-decoration: none; color: #111;
    border: 3px solid #a8a8a8; border-radius: 18px;
    font-family: inherit;
    background: #c4c4c4;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 900;
    letter-spacing: 0.02em;
    -webkit-text-stroke: 1px #111;
    padding: 8px 12px;
  }
  .back-bar > button + *, .back-bar > a + * { margin-top: 22px; }
  .version {
    max-width: 820px; margin: 6px auto 0 !important;
    text-align: right; font-size: 13px; color: #777;
  }
  .back-bar [hidden] { display: none; }
  /* No buttons showing: just the version number, no bar */
  .back-bar.only-version { background: transparent; border-top: none; padding-top: 0; pointer-events: none; }

  /* ── Splash screen ── */
  .splash {
    position: fixed; inset: 0; z-index: 100;
    background: #111;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    transition: opacity 0.6s ease;
  }
  .splash.fade { opacity: 0; pointer-events: none; }
  .splash .logo { width: min(60vw, 45vh, 320px); height: auto; display: block; }
  .splash .splash-version { font-size: 13px; color: #777; margin-top: -6px; }
  .splash .credit {
    position: absolute; left: 16px; right: 16px;
    bottom: calc(24px + env(safe-area-inset-bottom));
    font-size: clamp(15px, 3.8vw, 20px); color: #888;
  }

  /* ── HELP button (top of every screen) and help screen ── */
  #btn-help { display: none; }   /* hidden for now — delete this line to bring it back */
  #btn-help {
    background: #ff3b30; color: #fff; border-color: #fff;
    font-size: clamp(22px, 5.5vw, 30px); font-weight: 900; letter-spacing: 0.08em;
    padding: 8px 12px; margin-bottom: 14px;
  }
  .radio-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .btn-radio {
    flex: 1 1 0; min-width: 0; background: #4a4a4a; color: #f2f2f2; border-color: #6e6e6e;
    font-size: clamp(15px, 3.8vw, 26px); font-weight: 900; letter-spacing: 0.04em; line-height: 1.15;
    padding: 8px 6px; height: clamp(64px, 17vw, 90px);
  }
  #btn-moonmission { background: #0d47a1; border-color: #5c8fe0; }
  #btn-c895       { background: #6a1b9a; border-color: #ba68c8; }
  #btn-heart70s   { background: #b34700; border-color: #ff8a50; }
  #btn-heart80s   { background: #d6004f; border-color: #ff5c93; }
  #btn-gold       { background: #8a6508; border-color: #e0b84a; }
  #btn-close {
    display: block; width: 100%; color: #fff;
    font-size: clamp(20px, 5vw, 30px); font-weight: 900; letter-spacing: 0.08em;
    padding: 8px 12px;
  }
  #version { display: none; }   /* the version shows on the splash screen */
  #btn-close { margin: 0 auto; background: #c62828; border-color: #ef5350; color: #fff; -webkit-text-stroke: 0; font-size: clamp(20px, 5vw, 30px); letter-spacing: 0.08em; width: 100%; }
  /* ── Club Classics: yellow text and yellow buttons (CLOSE stays as it is) ── */
  #player.club, #player.club .now-text > div, #player.club .now .art-msg, #player.club .msg { color: #ffd400; }
  #player.club button { background: #ffd400; color: #111; border-color: #ffd400; }
  /* The genre that's on, and a pressed thumb: the other way round */
  #player.club .genres button[aria-pressed="true"],
  #player.club .rate button.on { background: #000; color: #ffd400; }
  #player.club #btn-play.playing { animation-name: play-flash-club; }
  @keyframes play-flash-club {
    0%, 100% { background: #ffd400; box-shadow: 0 0 0 0 rgba(255, 212, 0, 0); }
    50%      { background: #ffe873; box-shadow: 0 0 22px 6px rgba(255, 212, 0, 0.6); }
  }
  .help {
    position: fixed; inset: 0; z-index: 90;
    background: #111;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .help[hidden] { display: none; }
  .help .help-inner { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 22px; }
  #btn-send-help {
    background: #ff3b30; color: #fff;
    font-size: clamp(30px, 8.5vw, 48px); font-weight: 900; line-height: 1.2;
    min-height: 40vh;
  }
  #btn-send-help:disabled { cursor: default; }
  #btn-send-help.sent { background: #3ddc84; color: #111; }
  .help .help-status { font-size: clamp(22px, 5.5vw, 30px); min-height: 1.4em; color: #ccc; }
  .help .help-status a { color: #4fc3ff; }
  #btn-help-close { background: #c4c4c4; }
</style>
</head>
<body>
<div class="splash" id="splash" onclick="hideSplash()">
  <img class="logo" src="assets/dp-logo.webp" alt="dPaul">
  <div class="splash-version" id="splash-version"></div>
  <div class="credit">Developed by David Ahern - DPAUL 2026</div>
</div>
<div class="help" id="help" hidden role="dialog" aria-modal="true" aria-label="Help">
  <div class="help-inner">
    <button id="btn-send-help" onclick="sendHelp()">EMERGENCY ONLY</button>
    <div class="help-status" id="help-status" aria-live="polite"></div>
    <button id="btn-help-close" onclick="closeHelp()">GO BACK</button>
  </div>
</div>
<div class="wrap">

  <button id="btn-help" onclick="openHelp()">EMERGENCY ONLY</button>

  <div id="player" hidden>
    <!-- Genre buttons, filled in from ALBUMS -->
    <div class="genres" id="genres" role="group" aria-label="Genre"></div>
    <div class="now">
      <div class="art"><img id="cover" alt="" hidden><div class="art-msg" id="art-msg" hidden>search for album art</div></div>
      <div class="now-text">
        <div class="track" id="track-name"></div>
        <div class="artist" id="track-artist"></div>
        <div class="from" id="track-from"></div>
        <div class="count" id="track-count"></div>
      </div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="btn-prev" onclick="prevTrack()" aria-label="Previous song">
        <svg viewBox="0 0 100 60"><polygon points="50,0 50,60 0,30"/><polygon points="100,0 100,60 50,30"/></svg>
      </button>
      <button class="icon-btn" id="btn-play" onclick="togglePlay()" aria-label="Play"></button>
      <button class="icon-btn" id="btn-next" onclick="nextTrack()" aria-label="Next song">
        <svg viewBox="0 0 100 60"><polygon points="0,0 0,60 50,30"/><polygon points="50,0 50,60 100,30"/></svg>
      </button>
    </div>

    <canvas id="eq" aria-hidden="true"></canvas>

    <div class="rate">
      <button class="icon-btn" id="btn-dislike" onclick="dislikeSong()" aria-label="Don't like this song – skip it and never play it again">
        <svg viewBox="0 0 24 24"><g transform="rotate(180 12 12)"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></g></svg>
      </button>
      <button class="icon-btn" id="btn-like" onclick="toggleLike()" aria-label="Like this song" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
      </button>
    </div>

    <!-- The genre's two radio stations, filled in from ALBUMS -->
    <div class="radio-row" id="radio-row" role="group" aria-label="Radio stations"></div>

    <div class="msg" id="msg"></div>
  </div>

  <div class="back-bar" id="back-bar">
    <!-- CLOSE: pinned to the bottom so it never moves (player screen only) -->
    <button id="btn-close" onclick="location.href='https://www.google.com'" hidden>CLOSE</button>
    <div class="version" id="version"></div>
  </div>

  <audio id="audio" preload="auto" playsinline></audio>
</div>
<script>
/* ─────────────────────────────────────────────────────────────
   GENRES — one entry per genre button, songs all in /songs.

   "stations" are the radio stations offered with that genre.
   "tracks" is the list of MP3 file names, in play order.
   Album art: the sleeve of the original album (or single) the song
   first came out on, from assets/covers — named in "info" below.
   Pictures embedded in the MP3s are ignored, as they are often from
   compilations.

      "Are Friends Electric.mp3": ["Tubeway Army (Gary Numan)","Replicas",1979,"tubeway-army-replicas.jpg"],

      "Hanging On The Telephone(1).mp3": ["Blondie","Parallel Lines",1978,"blondie-parallel-lines.jpg"],

  {

const PLAY_ICON  = '<svg viewBox="0 0 52 60"><polygon points="0,0 0,60 52,30"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 52 60"><rect x="0" y="0" width="18" height="60" rx="2"/><rect x="34" y="0" width="18" height="60" rx="2"/></svg>';

const audio = document.getElementById('audio');
const playBtn = document.getElementById('btn-play');
const msg = document.getElementById('msg');

let album = null;
let trackIndex = 0;   // position in the shuffled play order
let order = [];       // album.tracks indexes, shuffled each time an album opens

// ── Thumbs up / down ──
// Saved on this phone/tablet only. 1 = liked, -1 = disliked.
let ratings = {};
try { ratings = JSON.parse(localStorage.getItem('ratings')) || {}; } catch (e) {}
function saveRatings() { try { localStorage.setItem('ratings', JSON.stringify(ratings)); } catch (e) {} }
function ratingKey(file) { return album.folder + '/' + file; }
function ratingOf(file) { return ratings[ratingKey(file)] || 0; }

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Liked songs first (shuffled), then the rest (shuffled).
// Disliked songs are left out altogether.
function shuffledOrder() {
  const idx = album.tracks.map((_, i) => i);
  const liked = idx.filter(i => ratingOf(album.tracks[i]) > 0);
  const other = idx.filter(i => ratingOf(album.tracks[i]) === 0);
  const result = shuffle(liked).concat(shuffle(other));
  if (result.length) return result;
  // Every song disliked — forget those dislikes rather than play nothing
  album.tracks.forEach(f => delete ratings[ratingKey(f)]);
  saveRatings();
  return shuffle(idx);
}

function toggleLike() {
  if (!album) return;
  const k = ratingKey(currentFile());
  if (ratings[k] > 0) delete ratings[k]; else ratings[k] = 1;
  saveRatings();
  updateLikeButton();
}

function dislikeSong() {
  if (!album) return;
  ratings[ratingKey(currentFile())] = -1;
  saveRatings();
  // Show it pressed (and thumbs up gone) for a moment, then skip
  document.getElementById('btn-dislike').classList.add('on');
  document.getElementById('btn-like').classList.add('gone');
  document.querySelectorAll('.rate button').forEach(b => b.disabled = true);
  const file = currentFile(), from = album;
  setTimeout(() => skipDisliked(file, from), 600);
}

function skipDisliked(file, from) {
  document.querySelectorAll('.rate button').forEach(b => b.disabled = false);
  if (album !== from) return;                  // genre changed meanwhile
  if (currentFile() !== file) {                // moved on meanwhile: just drop it from the list
    const pos = order.findIndex(i => album.tracks[i] === file);
    if (pos >= 0) { order.splice(pos, 1); if (pos < trackIndex) trackIndex--; }
    if (!order.length) { order = shuffledOrder(); trackIndex = 0; }
    document.getElementById('track-count').textContent =
      'Song ' + (trackIndex + 1) + ' of ' + order.length;
    return;
  }
  order.splice(trackIndex, 1);                 // never comes round again
  if (!order.length) order = shuffledOrder();
  if (trackIndex >= order.length) trackIndex = 0;
  loadTrack(trackIndex, true);                 // skip straight to the next one
}

function updateLikeButton() {
  const liked = album && ratingOf(currentFile()) > 0;
  const btn = document.getElementById('btn-like');
  btn.classList.toggle('on', !!liked);
  btn.classList.remove('gone');
  btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
  const down = document.getElementById('btn-dislike');
  down.classList.remove('on');
  down.classList.toggle('gone', !!liked);   // thumbs up pressed: thumbs down hides
}

function currentFile() { return album.tracks[order[trackIndex]]; }

function fileUrl(folder, file) {
  return encodeURIComponent(folder) + '/' + encodeURIComponent(file);
}

// Display name: drop ".mp3", " copy", a leading track number, tidy underscores
function niceName(file) {
  return file
    .replace(/\.mp3$/i, '')
    .replace(/\s+copy(\s+\d+)?$/i, '')
    .replace(/\s*\(\d+\)$/, '')
    .replace(/_t\b/g, "'t").replace(/_s\b/g, "'s")
    .replace(/_/g, ' ');
}

function buildGenres() {
  const row = document.getElementById('genres');
  ALBUMS.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.textContent = a.title.toUpperCase();
    btn.setAttribute('aria-pressed', 'false');
    btn.onclick = () => pickGenre(i);
    row.appendChild(btn);
  });
}

// Tapping a genre plays it. Tapping the one already on does nothing,
// unless the radio is playing: then it goes back to the songs.
function pickGenre(i) {
  if (album !== ALBUMS[i]) { openAlbum(i); return; }
  if (radio) loadTrack(trackIndex, true);
}

// The genre's own two radio stations
function buildStations() {
  const row = document.getElementById('radio-row');
  row.innerHTML = '';
  album.stations.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'btn-radio';
    btn.id = 'btn-' + key;
    btn.textContent = STATIONS[key].label;
    btn.onclick = () => toggleRadio(key);
    row.appendChild(btn);
  });
}

function openAlbum(i, autoplay = true) {
  album = ALBUMS[i];
  try { localStorage.setItem('genre', album.id); } catch (e) {}
  document.getElementById('player').classList.toggle('club', album.id === 'club');
  setTimeout(eqStart);   // bars take the genre's colour
  [...document.getElementById('genres').children].forEach((b, n) =>
    b.setAttribute('aria-pressed', n === i ? 'true' : 'false'));
  buildStations();
  order = shuffledOrder();   // a different song first each time
  // Never open on the song that was on last time (or a liked song
  // always coming first): swap it with a random later one.
  let last = null;
  try { last = localStorage.getItem('lastSong'); } catch (e) {}
  if (order.length > 1 && ratingKey(album.tracks[order[0]]) === last) {
    const j = 1 + Math.floor(Math.random() * (order.length - 1));
    [order[0], order[j]] = [order[j], order[0]];
  }


  showPlayer();
  loadTrack(0, autoplay);
}

// CLOSE shows on the player screen
function updateClose() {
  document.getElementById('btn-close').hidden =
    document.getElementById('player').hidden;
  fitBackBar();
}

function showPlayer() {
  document.getElementById('player').hidden = false;
  updateClose();
  window.scrollTo(0, 0);
}

function loadTrack(i, autoplay) {
  if (!album || !order.length) return;
  trackIndex = (i + order.length) % order.length;
  setRadioMode(false);
  const file = currentFile();
  try { localStorage.setItem('lastSong', ratingKey(file)); } catch (e) {}
  audio.src = fileUrl(album.folder, file);
  showArt(file);
  const nameEl = document.getElementById('track-name');
  nameEl.textContent = niceName(file);
  const year = album.years && album.years[file];
  if (year) {
    const y = document.createElement('span');
    y.className = 'year';
    y.textContent = ' (' + year + ')';
    nameEl.appendChild(y);
  }
  const inf = trackInfo(file);
  document.getElementById('track-artist').textContent = inf ? inf[0] : '';
  document.getElementById('track-from').textContent = inf
    ? (inf[1].endsWith('(single)') ? 'Single: ' + inf[1].replace(/\s*\(single\)$/, '')
                                   : 'Album: ' + inf[1]) + ' (' + inf[2] + ')'
    : '';
  document.getElementById('track-count').textContent =
    'Song ' + (trackIndex + 1) + ' of ' + order.length;
  updateLikeButton();
  msg.textContent = '';
  if (autoplay) play(); else updatePlayButton();
}

// ── Album art ──
// Picture embedded in the MP3 first; failing that the album's cover
// image (cover.jpg unless the ALBUMS list names another); failing that,
// nothing — the page simply has no picture.
const coverEl = document.getElementById('cover');
let artToken = 0;

// No picture (none for this song, it failed, or it still hasn't loaded
// after a minute): a plain white-label record fills the box instead.
let artTimer = null;
function artMissing() {
  const artMsg = document.getElementById('art-msg');
  coverEl.hidden = true;
  artMsg.textContent = 'no artwork';   // read out by screen readers only
  artMsg.classList.add('white-label');
  artMsg.hidden = false;
}
function setArt(src) {
  const artMsg = document.getElementById('art-msg');
  clearTimeout(artTimer);
  artMsg.classList.remove('flash', 'white-label');
  artMsg.textContent = 'search for album art';
  if (!src) { coverEl.removeAttribute('src'); artMissing(); updateMediaSession(null); return; }
  // Shown while the picture loads
  coverEl.hidden = true; artMsg.hidden = false;
  artTimer = setTimeout(artMissing, 60000);
  coverEl.onerror = () => { clearTimeout(artTimer); artMissing(); };
  coverEl.onload = () => { clearTimeout(artTimer); artMsg.classList.remove('flash'); coverEl.hidden = false; artMsg.hidden = true; };
  coverEl.src = src;
  updateMediaSession(src);
}

function trackInfo(file) { return album && album.info && album.info[file]; }

// Original sleeve for this song, or no picture if there isn't one
function showArt(file) {
  artToken++;
  const inf = trackInfo(file);
  setArt(inf && inf[3] ? 'assets/covers/' + encodeURIComponent(inf[3]) : null);
}

function updateMediaSession(artSrc) {
  if (!('mediaSession' in navigator) || !album || radio) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: niceName(currentFile()),
    artist: (trackInfo(currentFile()) || [])[0] || '',
    album: (trackInfo(currentFile()) || [])[1] || album.title,
    artwork: artSrc ? [{ src: new URL(artSrc, location.href).href }] : []
  });
}

// ── Radio stations ──
// Plays a live stream through the same player, so music and radio
// never play at once. Tapping the playing station's button again (or
// a skip button) goes back to the songs.
const STATIONS = {
  moonmission: { name: 'Moon Mission Tokyo (Japan)', label: 'JAPAN DANCE TOKYO', url: 'https://uk5.internet-radio.com/proxy/mmr?mp=/stream;', art: 'assets/moonmission.svg?v=2' },
  c895: { name: 'Dance 89.5 (USA)', label: 'USA DANCE 89.5', url: 'https://knhc-ice.streamguys1.com/live', art: 'assets/c895.svg' },
  heart70s: { name: 'Heart 70s', label: 'HEART 70s', url: 'https://media-ssl.musicradio.com/Heart70sMP3', art: 'assets/heart70s.svg' },
  heart80s: { name: 'Heart 80s', label: 'HEART 80s', url: 'https://media-ssl.musicradio.com/Heart80sMP3', art: 'assets/heart80s.svg' },
  gold: { name: 'Gold Radio', label: 'GOLD RADIO', url: 'https://media-ssl.musicradio.com/GoldMP3', art: 'assets/gold.svg' }
};
let radio = null;                              // key of the station playing, or null for music

function setRadioMode(key) {
  radio = key || null;
  for (const k of album.stations) {
    document.getElementById('btn-' + k).textContent = radio === k ? 'BACK TO MUSIC' : STATIONS[k].label;
  }
  document.querySelector('.rate').style.visibility = radio ? 'hidden' : '';
  updateRadioOn();
  eqStart();
}

function toggleRadio(key) {
  if (radio === key) { loadTrack(trackIndex, true); return; }
  const st = STATIONS[key];
  setRadioMode(key);
  artToken++;                                  // ignore any song picture still loading
  setArt(st.art);
  document.getElementById('track-name').textContent = st.name;
  document.getElementById('track-artist').textContent = '';
  document.getElementById('track-from').textContent = '';
  document.getElementById('track-count').textContent = 'Live';
  msg.textContent = '';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: st.name, album: 'Live',
      artwork: [{ src: new URL(st.art, location.href).href }]
    });
  }
  audio.src = st.url;
  play();
}

function play() {
  // Live radio: reconnect so it carries on from now, not from the pause
  if (radio && audio.paused) audio.src = STATIONS[radio].url;
  // Phones sometimes block sound until a button is pressed — if so,
  // the PLAY button is left showing so one tap starts it.
  audio.play().catch(updatePlayButton);
}

function togglePlay() { if (audio.paused) play(); else audio.pause(); }
function nextTrack() { loadTrack(radio ? trackIndex : trackIndex + 1, true); }

function prevTrack() {
  // A few seconds in, Prev restarts the song, like a CD player
  if (radio) { loadTrack(trackIndex, true); return; }
  if (audio.currentTime > 5) { audio.currentTime = 0; return; }
  loadTrack(trackIndex - 1, true);
}


function updateRadioOn() {
  document.getElementById('player').classList.toggle('radio-on', !!radio && !audio.paused);
}
function updatePlayButton() {
  updateRadioOn();
  const playing = !audio.paused;
  playBtn.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
  playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  playBtn.classList.toggle('playing', playing);
}

audio.addEventListener('play', updatePlayButton);
audio.addEventListener('pause', updatePlayButton);
audio.addEventListener('ended', () => {
  if (radio) { updatePlayButton(); return; }
  if (trackIndex < order.length - 1) nextTrack();
  else updatePlayButton();
});
audio.addEventListener('error', () => {
  msg.textContent = radio ? STATIONS[radio].name + ' could not be reached.' : 'This song could not be found.';
  updatePlayButton();
});

// ── Graphic EQ ──
// The levels come from a separate copy of the song, worked out ahead
// and looked up by playing time. The player's own sound is never routed
// through Web Audio, which could stop it when the phone locks.
// Radio has no bars: a hungry record chases a ghost there instead.
const EQ_BANDS = 16, EQ_FPS = 25, EQ_RATE = 22050, EQ_N = 1024;
const eqCanvas = document.getElementById('eq');
const eqNow = new Float32Array(EQ_BANDS);
let eqData = null, eqUrl = '', eqAbort = null, eqRunning = false;

function eqFft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; }   // im is all zero here
  }
  for (let len = 2; len <= n; len <<= 1) {
    const half = len >> 1, step = -2 * Math.PI / len;
    for (let k = 0; k < half; k++) {
      const c = Math.cos(step * k), d = Math.sin(step * k);
      for (let a = k; a < n; a += len) {
        const b = a + half, x = re[b] * c - im[b] * d, y = re[b] * d + im[b] * c;
        re[b] = re[a] - x; im[b] = im[a] - y; re[a] += x; im[a] += y;
      }
    }
  }
}

async function eqLoad() {
  const url = audio.src;
  if (radio || document.hidden || audio.paused || url === eqUrl) return;
  if (eqAbort) eqAbort.abort();
  const ctl = eqAbort = new AbortController();
  eqUrl = url; eqData = null;
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error('not found');
    const bytes = await res.arrayBuffer();
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const buf = await new Promise((ok, no) => {
      const pr = new Ctx(1, 1, EQ_RATE).decodeAudioData(bytes, ok, no);
      if (pr && pr.catch) pr.catch(no);
    });
    if (ctl.signal.aborted) return;
    const pcm = buf.getChannelData(0), rate = buf.sampleRate;
    const frames = Math.ceil(buf.duration * EQ_FPS);
    const raw = new Float32Array(frames * EQ_BANDS);
    const re = new Float32Array(EQ_N), im = new Float32Array(EQ_N), edges = [];
    for (let b = 0; b <= EQ_BANDS; b++) edges.push(40 * Math.pow(10000 / 40, b / EQ_BANDS) * EQ_N / rate);
    const peaks = new Float32Array(EQ_BANDS);
    for (let f = 0; f < frames; f++) {
      const at = Math.floor(f * rate / EQ_FPS) - EQ_N / 2;
      for (let i = 0; i < EQ_N; i++) {
        re[i] = (pcm[at + i] || 0) * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / EQ_N));
        im[i] = 0;
      }
      eqFft(re, im);
      for (let b = 0; b < EQ_BANDS; b++) {
        const lo = Math.max(1, Math.floor(edges[b])), hi = Math.max(lo + 1, Math.floor(edges[b + 1]));
        let m = 0;
        for (let k = lo; k < hi; k++) m = Math.max(m, re[k] * re[k] + im[k] * im[k]);
        m = Math.sqrt(m);
        raw[f * EQ_BANDS + b] = m;
        if (m > peaks[b]) peaks[b] = m;
      }
      if (f % 200 === 199) {                    // let the buttons stay responsive
        await new Promise(r => setTimeout(r));
        if (ctl.signal.aborted) return;
      }
    }
    // Each band on its own scale: its loudest moment fills the bar
    for (let i = 0; i < raw.length; i++) {
      const pk = peaks[i % EQ_BANDS];
      raw[i] = pk ? Math.max(0, 1 + 20 * Math.log10(raw[i] / pk + 1e-6) / 40) : 0;
    }
    eqData = raw;
  } catch (e) {
    if (!ctl.signal.aborted) eqData = null;     // bars stay flat for this song
  }
}

function eqLevel(b) {
  if (audio.paused || radio) return 0;
  if (!eqData || eqUrl !== audio.src) return 0;
  return eqData[Math.floor(audio.currentTime * EQ_FPS) * EQ_BANDS + b] || 0;
}

// ── Radio chase ── each ghost eaten brings the next colour
const GHOSTS = ['#ff8c00', '#3ddc5a', '#ff5cb8'];   // orange, green, pink
const CHASE_SECS = 6, CAUGHT = 0.6;                 // length of a chase; when the ghost is eaten
let chaseT = 0, chaseLast = 0;

function drawGhost(g, x, y, r, t, colour) {
  g.save(); g.translate(x, y);
  g.fillStyle = g.strokeStyle = colour;
  // little waving arms, and a body trailing off to a wisp behind
  g.lineWidth = r * 0.28; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(r * 0.3, r * 0.2); g.lineTo(r * 1.05, r * (0.1 + 0.3 * Math.sin(t * 9)));
  g.moveTo(-r * 0.3, r * 0.3); g.lineTo(-r * 0.95, r * (0.2 - 0.3 * Math.sin(t * 9)));
  g.stroke();
  const sway = r * 0.15 * Math.sin(t * 6);
  g.beginPath();
  g.moveTo(-r * 0.75, -r * 0.1);
  g.bezierCurveTo(-r * 0.75, -r * 1.25, r * 0.75, -r * 1.25, r * 0.75, -r * 0.1);
  g.bezierCurveTo(r * 0.75, r * 0.7, r * 0.1, r * 0.8, -r * 1.1 + sway, r * 1.15);
  g.bezierCurveTo(-r * 0.4, r * 0.7, -r * 0.75, r * 0.5, -r * 0.75, -r * 0.1);
  g.fill();
  // looking back, mouth open
  g.fillStyle = '#111';
  g.beginPath(); g.ellipse(-r * 0.38, -r * 0.3, r * 0.1, r * 0.17, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(r * 0.08, -r * 0.3, r * 0.1, r * 0.17, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(-r * 0.15, r * 0.1, r * 0.13, r * 0.18, 0, 0, 7); g.fill();
  g.restore();
}

function drawRecord(g, x, y, r, t, mouth, label) {
  g.save(); g.translate(x, y);
  // running legs and red shoes
  const step = Math.floor(t * 8) % 2 ? 1 : -1;
  for (const side of [-1, 1]) {
    const fx = r * 0.35 * side, lift = side === step ? r * 0.15 : 0;
    g.fillStyle = '#fff'; g.fillRect(fx - r * 0.09, r * 0.85, r * 0.18, r * 0.5 - lift);
    g.fillStyle = '#e53935'; g.fillRect(fx - r * 0.15, r * 1.3 - lift, r * 0.5, r * 0.22);
  }
  const pie = rad => { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, rad, mouth, 2 * Math.PI - mouth); g.closePath(); };
  g.fillStyle = '#ffd400'; pie(r); g.fill();
  g.strokeStyle = '#b36b00'; g.lineWidth = r * 0.09;              // vinyl grooves
  for (const k of [0.82, 0.6]) { g.beginPath(); g.arc(0, 0, r * k, mouth + 0.1, 2 * Math.PI - mouth - 0.1); g.stroke(); }
  g.fillStyle = label; pie(r * 0.42); g.fill();
  g.fillStyle = '#111'; g.fillRect(-r * 0.2, -r * 0.08, r * 0.14, r * 0.14);   // the hole
  // headphones and an eye
  g.strokeStyle = '#e53935'; g.lineWidth = r * 0.17;
  g.beginPath(); g.arc(0, 0, r * 1.1, Math.PI * 1.02, Math.PI * 1.75); g.stroke();
  g.fillStyle = '#e53935'; g.fillRect(-r * 1.28, -r * 0.2, r * 0.36, r * 0.6);
  g.fillStyle = '#fff'; g.fillRect(r * 0.02, -r * 0.78, r * 0.36, r * 0.36);
  g.fillStyle = '#111'; g.fillRect(r * 0.2, -r * 0.7, r * 0.18, r * 0.24);
  g.restore();
}

function drawNote(g, x, y, r) {
  g.fillStyle = '#4fc3ff';
  g.fillRect(x, y - r * 0.4, r * 0.12, r * 0.6);
  g.fillRect(x, y - r * 0.4, r * 0.34, r * 0.18);
  g.fillRect(x - r * 0.26, y + r * 0.1, r * 0.38, r * 0.26);
}

// Draws one frame of the chase on a w x h picture
function chaseScene(g, w, h) {
  const n = Math.floor(chaseT / CHASE_SECS), p = chaseT / CHASE_SECS - n, t = chaseT;
  const r = Math.min(h * 0.2, w * 0.14), y = h / 2;
  const colour = GHOSTS[n % GHOSTS.length];
  const x = -7 * r + p * (w + 10 * r);
  const since = (p - CAUGHT) * CHASE_SECS;                        // seconds since it was eaten
  g.save();
  if (n % 2) { g.translate(w, 0); g.scale(-1, 1); }               // every other chase runs right to left
  for (let k = 0; k < 6; k++) {                                   // notes vanish as the record reaches them
    const nx = w * (k + 0.5) / 6;
    if (nx > x + r * 0.6) drawNote(g, nx, y, r);
  }
  if (since < 0) drawGhost(g, x + r * 1.2 + 3.5 * r * (1 - p / CAUGHT), y + r * 0.15 * Math.sin(t * 7), r * 0.85, t, colour);
  const mouth = since >= 0 && since < 0.5 ? 0.05 : [0.1, 0.4, 0.65, 0.4][Math.floor(t * 12) % 4];
  drawRecord(g, x, y, r, t, mouth, since >= 0 ? colour : '#fff'); // label takes the ghost's colour
  if (since >= 0 && since < 0.7) {
    g.fillStyle = colour;
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4, d = r * (0.6 + since * 2.4), z = r * 0.26 * (1 - since / 0.8);
      g.fillRect(x + r + Math.cos(a) * d - z / 2, y + Math.sin(a) * d - z / 2, z, z);
    }
  }
  g.restore();
}

// Arcade look: draw it tiny, snap every dot to a few flat colours,
// then blow it up with hard square edges.
const CHASE_PIXEL = 4;                                            // size of one big pixel on screen
const CHASE_COLOURS = [...GHOSTS, '#ffd400', '#b36b00', '#e53935', '#ffffff', '#111111', '#4fc3ff']
  .map(c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)));
const chaseCanvas = document.createElement('canvas');
let chaseDrawn = '';
function drawChase(g, w, h) {
  const now = performance.now() / 1000;
  if (!audio.paused) chaseT += Math.min(0.05, now - chaseLast);   // waits while paused
  chaseLast = now;
  const dpr = w / (eqCanvas.clientWidth || w);
  const sw = Math.max(1, Math.round(w / dpr / CHASE_PIXEL)), sh = Math.max(1, Math.round(h / dpr / CHASE_PIXEL));
  const frame = [Math.floor(chaseT * 24), sw, sh].join();         // 24 pictures a second is plenty
  if (frame !== chaseDrawn) {
    chaseDrawn = frame;
    chaseCanvas.width = sw; chaseCanvas.height = sh;
    const c = chaseCanvas.getContext('2d', { willReadFrequently: true });
    chaseScene(c, sw, sh);
    const img = c.getImageData(0, 0, sw, sh), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 128) { d[i + 3] = 0; continue; }
      let best = null, bd = Infinity;
      for (const q of CHASE_COLOURS) {
        const e = (d[i] - q[0]) ** 2 + (d[i + 1] - q[1]) ** 2 + (d[i + 2] - q[2]) ** 2;
        if (e < bd) { bd = e; best = q; }
      }
      d[i] = best[0]; d[i + 1] = best[1]; d[i + 2] = best[2]; d[i + 3] = 255;
    }
    c.putImageData(img, 0, 0);
  }
  g.imageSmoothingEnabled = false;
  g.drawImage(chaseCanvas, 0, 0, w, h);
}

function eqDraw() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(eqCanvas.clientWidth * dpr), h = Math.round(eqCanvas.clientHeight * dpr);
  if (eqCanvas.width !== w) eqCanvas.width = w;
  if (eqCanvas.height !== h) eqCanvas.height = h;
  const g = eqCanvas.getContext('2d');
  g.clearRect(0, 0, w, h);
  if (radio) {
    eqNow.fill(0);
    drawChase(g, w, h);
    eqRunning = !document.hidden && !audio.paused;
    if (eqRunning) requestAnimationFrame(eqDraw);
    return;
  }
  g.fillStyle = album && album.id === 'club' ? '#ffd400' : '#ff8c00';
  const gap = 4 * dpr, bw = (w - gap * (EQ_BANDS - 1)) / EQ_BANDS;
  let moving = false;
  for (let b = 0; b < EQ_BANDS; b++) {
    const v = eqLevel(b);
    eqNow[b] = v > eqNow[b] ? v : Math.max(v, eqNow[b] - 0.035);   // quick up, gentle fall
    if (eqNow[b] > 0.001) moving = true;
    const bh = Math.max(3 * dpr, eqNow[b] * h);
    g.fillRect(b * (bw + gap), h - bh, bw, bh);
  }
  eqRunning = !document.hidden && (moving || !audio.paused);
  if (eqRunning) requestAnimationFrame(eqDraw);
}
function eqStart() { if (!eqRunning) { eqRunning = true; requestAnimationFrame(eqDraw); } }
audio.addEventListener('playing', () => { eqLoad(); eqStart(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { eqLoad(); eqStart(); } });
window.addEventListener('resize', eqStart);
if (window.ResizeObserver) new ResizeObserver(eqStart).observe(eqCanvas);

// Lock-screen / headphone controls on phones
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
}

// Keep page content clear of the bottom bar, whatever is showing in it
function fitBackBar() {
  const bar = document.getElementById('back-bar');
  const empty = [...bar.children].every(el => el.hidden || el.id === 'version');
  bar.classList.toggle('only-version', empty);
  document.body.style.paddingBottom = (bar.offsetHeight + 16) + 'px';
}
window.addEventListener('resize', fitBackBar);

// Version number lives in the <meta name="version"> tag at the top
document.getElementById('version').textContent =
  'v' + (document.querySelector('meta[name="version"]')?.content || '');

// ── HELP ──
// Pressing HELP stops the music and shows the help screen. The big
// button there sends an email through FormSubmit.co. The very first
// one sent makes FormSubmit email the owner a link to switch it on.
const HELP_EMAIL = 'davidpaulahern@gmail.com';

document.getElementById('splash-version').textContent =
  'v' + (document.querySelector('meta[name="version"]')?.content || '');

let helpSending = false;
let helpLocation = null;   // Promise of { link, accuracy } or { error }

// Asks the phone where it is. The phone may ask "Allow location?" the
// first time. Never rejects: gives back either a place or a reason.
function findLocation() {
  return new Promise(resolve => {
    if (!('geolocation' in navigator)) return resolve({ error: 'not supported on this device' });
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude: lat, longitude: lon, accuracy } = pos.coords;
        resolve({
          link: 'https://www.google.com/maps?q=' + lat.toFixed(6) + ',' + lon.toFixed(6),
          accuracy: 'about ' + Math.round(accuracy) + ' metres'
        });
      },
      err => resolve({ error: err.code === 1 ? 'permission was refused' :
                              err.code === 3 ? 'took too long to find' : 'could not be found' }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  });
}

function openHelp() {
  audio.pause();
  // Start finding the location now, so it is usually ready by the tap
  helpLocation = findLocation();
  const btn = document.getElementById('btn-send-help');
  btn.disabled = false;
  btn.classList.remove('sent');
  btn.textContent = 'EMERGENCY ONLY';
  document.getElementById('help-status').textContent = '';
  document.getElementById('help').hidden = false;
}

function closeHelp() {
  document.getElementById('help').hidden = true;
}

async function sendHelp() {
  if (helpSending) return;
  helpSending = true;
  const btn = document.getElementById('btn-send-help');
  const status = document.getElementById('help-status');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  status.textContent = '';
  const when = new Date().toLocaleString('en-GB');
  const song = (album && album.tracks.length) ? niceName(currentFile()) : '';
  // Wait up to 8 seconds for the location, then send without it
  status.textContent = 'Finding where you are…';
  const place = await Promise.race([
    helpLocation || findLocation(),
    new Promise(r => setTimeout(() => r({ error: 'took too long to find' }), 8000))
  ]);
  status.textContent = '';
  try {
    const res = await fetch('https://formsubmit.co/ajax/' + HELP_EMAIL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: 'Dad needs help',
        _template: 'box',
        message: 'Dad needs help. He pressed the EMERGENCY ONLY button in Simple Play.',
        time: when,
        location: place.link || ('Not available – ' + place.error),
        location_accuracy: place.accuracy || '',
        last_song: song,
        device: navigator.userAgent
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || String(data.success) !== 'true') throw new Error(data.message || 'not sent');
    btn.classList.add('sent');
    btn.textContent = 'Help has been asked for';
    status.textContent = 'An email has been sent.';
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'EMERGENCY ONLY';
    const body = encodeURIComponent('Dad needs help. (Sent from Simple Play, ' + when + ')' +
      (place.link ? '\nWhere I am: ' + place.link : ''));
    status.innerHTML = 'It did not send. Tap the button to try again, or <a href="mailto:' +
      HELP_EMAIL + '?subject=' + encodeURIComponent('Dad needs help') + '&body=' + body +
      '">send an email instead</a>.';
  } finally {
    helpSending = false;
  }
}

// Splash shows for a few seconds, then fades; a tap skips it
function hideSplash() {
  const el = document.getElementById('splash');
  if (!el || el.classList.contains('fade')) return;
  el.classList.add('fade');
  setTimeout(() => el.remove(), 700);
}
setTimeout(hideSplash, 3000);

updatePlayButton();
buildGenres();
// Open straight onto the controls with the last genre used (80's the
// first time) — not playing yet, one tap on Play starts it.
let savedGenre = '80s';
try { savedGenre = localStorage.getItem('genre') || savedGenre; } catch (e) {}
openAlbum(Math.max(0, ALBUMS.findIndex(a => a.id === savedGenre)), false);
